services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_crazy
      POSTGRES_USER: chat_crazy
      POSTGRES_PASSWORD: chat_crazy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_crazy -d chat_crazy"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://chat_crazy:chat_crazy@postgres:5432/chat_crazy
      FRONTEND_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
